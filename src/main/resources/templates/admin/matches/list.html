<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Partidos | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space"><div class="section-heading"><div><span class="eyebrow text-green">COMPETICIONES</span><h1>Calendario y resultados</h1><p>Los marcadores finalizados alimentan la tabla de posiciones.</p></div><a class="btn btn-lime" href="/admin/partidos/nuevo">Programar partido</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
<div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${!#lists.isEmpty(matches)}"><table class="table align-middle mb-0"><thead><tr><th>Fecha</th><th>Torneo</th><th>Jornada</th><th>Local</th><th>Resultado</th><th>Visitante</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="match : ${matches}"><td th:text="${#temporals.format(match.scheduledAt, 'dd/MM/yyyy HH:mm')}">Fecha</td><td th:text="${match.competition.name}">Torneo</td><td th:text="${match.roundNumber != null ? match.roundNumber : '—'}">—</td><td th:text="${match.homeTeam.name}">Local</td><td class="fw-bold" th:text="${match.homeGoals != null ? match.homeGoals + ' - ' + match.awayGoals : 'vs'}">vs</td><td th:text="${match.awayTeam.name}">Visitante</td><td th:text="${match.status.label}">Estado</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/partidos/{id}/editar(id=${match.id})}">Editar</a><a class="btn btn-sm btn-outline-success" th:href="@{/admin/partidos/{id}/acta(id=${match.id})}">Acta</a></td></tr></tbody></table></div>
<div class="empty-state" th:if="${#lists.isEmpty(matches)}"><h2>No hay partidos programados</h2><p>Configura un torneo y sus equipos participantes primero.</p></div></main></body></html>
