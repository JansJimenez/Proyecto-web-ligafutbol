<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' | Liga Copa Perú'">Partido</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space form-container"><a class="link-green fw-semibold" href="/admin/partidos">← Calendario</a><h1 class="mt-4" th:text="${title}">Programar partido</h1><div class="alert alert-warning" th:if="${#lists.isEmpty(competitions) or #lists.isEmpty(teams)}">Necesitas configurar torneos y equipos activos antes de programar partidos.</div>
<form class="card form-card mt-4" method="post" th:action="${action}" th:object="${matchForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="competitionId">Torneo *</label><select class="form-select" id="competitionId" th:field="*{competitionId}" required><option value="">Selecciona un torneo</option><option th:each="competition : ${competitions}" th:value="${competition.id}" th:text="${competition.name + ' · ' + competition.season.year}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="scheduledAt">Fecha y hora *</label><input class="form-control" id="scheduledAt" type="datetime-local" th:field="*{scheduledAt}" required><div class="text-danger small" th:errors="*{scheduledAt}"></div></div>
<div class="col-md-5"><label class="form-label" for="homeTeamId">Equipo local *</label><select class="form-select" id="homeTeamId" th:field="*{homeTeamId}" required><option value="">Selecciona equipo local</option><option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name + ' · ' + team.competition.name}"></option></select></div>
<div class="col-md-2"><label class="form-label" for="roundNumber">Jornada</label><input class="form-control" id="roundNumber" type="number" min="1" th:field="*{roundNumber}"></div>
<div class="col-md-5"><label class="form-label" for="awayTeamId">Equipo visitante *</label><select class="form-select" id="awayTeamId" th:field="*{awayTeamId}" required><option value="">Selecciona equipo visitante</option><option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name + ' · ' + team.competition.name}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="homeGoals">Goles local</label><input class="form-control" id="homeGoals" type="number" min="0" th:field="*{homeGoals}"></div><div class="col-md-6"><label class="form-label" for="awayGoals">Goles visitante</label><input class="form-control" id="awayGoals" type="number" min="0" th:field="*{awayGoals}"></div>
<div class="col-md-6"><label class="form-label" for="status">Estado del partido</label><select class="form-select" id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value.label}"></option></select><div class="form-text">Solo los partidos finalizados incorporan el marcador a la tabla oficial.</div></div><div class="col-md-6"><label class="form-label" for="stadium">Estadio</label><input class="form-control" id="stadium" th:field="*{stadium}" maxlength="150"></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/partidos">Cancelar</a><button class="btn btn-lime" type="submit" th:disabled="${#lists.isEmpty(competitions) or #lists.isEmpty(teams)}">Guardar partido</button></div></form></main></body></html>
