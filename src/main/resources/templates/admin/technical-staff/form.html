<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' | Liga Copa Perú'">Cuerpo técnico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space form-container"><a class="link-green fw-semibold" href="/admin/cuerpo-tecnico">← Cuerpo técnico</a><h1 class="mt-4" th:text="${title}">Nuevo integrante</h1>
<div class="alert alert-warning" th:if="${#lists.isEmpty(teams)}">Registra al menos un equipo activo antes de asignar personal.</div>
<form class="card form-card mt-4" method="post" enctype="multipart/form-data" th:action="${action}" th:object="${staffForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="firstName">Nombres *</label><input class="form-control" id="firstName" th:field="*{firstName}" maxlength="100" required><div class="text-danger small" th:errors="*{firstName}"></div></div>
<div class="col-md-6"><label class="form-label" for="lastName">Apellidos *</label><input class="form-control" id="lastName" th:field="*{lastName}" maxlength="100" required><div class="text-danger small" th:errors="*{lastName}"></div></div>
<div class="col-md-6"><label class="form-label" for="teamId">Equipo *</label><select class="form-select" id="teamId" th:field="*{teamId}" required><option value="">Selecciona un equipo</option><option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name + ' · ' + team.club.officialName}"></option></select><div class="text-danger small" th:errors="*{teamId}"></div></div>
<div class="col-md-6"><label class="form-label" for="role">Función *</label><select class="form-select" id="role" th:field="*{role}" required><option th:each="role : ${roles}" th:value="${role}" th:text="${role.label}"></option></select><div class="text-danger small" th:errors="*{role}"></div></div>
<div class="col-md-6"><label class="form-label" for="email">Correo</label><input class="form-control" id="email" type="email" th:field="*{email}" maxlength="254"><div class="text-danger small" th:errors="*{email}"></div></div>
<div class="col-md-6"><label class="form-label" for="phone">Teléfono</label><input class="form-control" id="phone" type="tel" th:field="*{phone}" maxlength="30"><div class="text-danger small" th:errors="*{phone}"></div></div>
<div class="col-md-6"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value.label}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="photoFile">Fotografía del integrante</label><input class="form-control" id="photoFile" type="file" th:field="*{photoFile}" accept="image/png,image/jpeg" data-image-preview="#staffPhotoPreview"><div class="form-text">PNG o JPG, máximo 5 MB. Esta fotografía puede aparecer públicamente.</div><img class="upload-preview mt-2" id="staffPhotoPreview" th:if="${staffForm.photoUrl != null and !staffForm.removePhoto}" th:src="${staffForm.photoUrl}" alt="Fotografía actual del integrante"><label class="form-check mt-2" th:if="${staffForm.photoUrl != null}"><input class="form-check-input" type="checkbox" th:field="*{removePhoto}"><span class="form-check-label">Quitar la fotografía actual</span></label></div>
<div class="col-md-6"><label class="form-label" for="identityDocumentFile">Documento de identidad (DNI, pasaporte u otro)</label><input class="form-control" id="identityDocumentFile" type="file" th:field="*{identityDocumentFile}" accept="image/png,image/jpeg,application/pdf"><div class="form-text">Opcional. PNG, JPG o PDF, máximo 5 MB. Solo lo puede consultar un administrador.</div><a class="d-inline-block mt-2" th:if="${staffForm.identityDocumentUrl != null}" th:href="${staffForm.identityDocumentUrl}" target="_blank" rel="noopener">Descargar documento cargado</a><label class="form-check mt-2" th:if="${staffForm.identityDocumentUrl != null}"><input class="form-check-input" type="checkbox" th:field="*{removeIdentityDocument}"><span class="form-check-label">Quitar el documento actual</span></label></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/cuerpo-tecnico">Cancelar</a><button class="btn btn-lime" type="submit" th:disabled="${#lists.isEmpty(teams)}">Guardar integrante</button></div></form></main></body></html>
