<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' | Liga Copa Perú'">Club | Liga Copa Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space form-container">
  <a class="link-green fw-semibold" href="/admin/clubes">← Volver a clubes</a>
  <span class="eyebrow text-green d-block mt-4">GESTIÓN INSTITUCIONAL</span>
  <h1 th:text="${pageTitle}">Registrar club</h1>
  <p class="text-secondary">Los campos con * son obligatorios. Los cambios se guardan en la base de datos configurada.</p>
  <form class="card form-card mt-4" method="post" th:action="${formAction}" th:object="${clubForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="row g-3">
      <div class="col-md-8"><label class="form-label" for="officialName">Nombre oficial *</label><input class="form-control" id="officialName" th:field="*{officialName}" required maxlength="150"><div class="text-danger small" th:errors="*{officialName}"></div></div>
      <div class="col-md-4"><label class="form-label" for="acronym">Siglas</label><input class="form-control text-uppercase" id="acronym" th:field="*{acronym}" maxlength="12"><div class="text-danger small" th:errors="*{acronym}"></div></div>
      <div class="col-md-6"><label class="form-label" for="shortName">Nombre corto</label><input class="form-control" id="shortName" th:field="*{shortName}" maxlength="80"></div>
      <div class="col-md-3"><label class="form-label" for="foundedYear">Año de fundación</label><input class="form-control" id="foundedYear" th:field="*{foundedYear}" type="number" min="1800" max="2100"><div class="text-danger small" th:errors="*{foundedYear}"></div></div>
      <div class="col-md-3"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" th:field="*{status}"><option th:each="statusOption : ${statuses}" th:value="${statusOption}" th:text="${statusOption.name() == 'ACTIVE' ? 'Activo' : 'Inactivo'}"></option></select></div>
      <div class="col-12"><label class="form-label" for="description">Descripción institucional</label><textarea class="form-control" id="description" rows="3" th:field="*{description}" maxlength="2000"></textarea></div>
      <div class="col-md-4"><label class="form-label" for="country">País</label><input class="form-control" id="country" th:field="*{country}" maxlength="80"></div>
      <div class="col-md-4"><label class="form-label" for="department">Departamento</label><input class="form-control" id="department" th:field="*{department}" maxlength="100"></div>
      <div class="col-md-4"><label class="form-label" for="province">Provincia</label><input class="form-control" id="province" th:field="*{province}" maxlength="100"></div>
      <div class="col-md-4"><label class="form-label" for="district">Distrito</label><input class="form-control" id="district" th:field="*{district}" maxlength="100"></div>
      <div class="col-md-8"><label class="form-label" for="stadium">Estadio habitual</label><input class="form-control" id="stadium" th:field="*{stadium}" maxlength="150"></div>
      <div class="col-md-6"><label class="form-label" for="president">Presidente o representante</label><input class="form-control" id="president" th:field="*{president}" maxlength="120"></div>
      <div class="col-md-6"><label class="form-label" for="delegateName">Delegado</label><input class="form-control" id="delegateName" th:field="*{delegateName}" maxlength="120"></div>
      <div class="col-md-4"><label class="form-label" for="phone">Teléfono</label><input class="form-control" id="phone" th:field="*{phone}" maxlength="40"></div>
      <div class="col-md-4"><label class="form-label" for="email">Correo</label><input class="form-control" id="email" th:field="*{email}" type="email" maxlength="180"><div class="text-danger small" th:errors="*{email}"></div></div>
      <div class="col-md-4"><label class="form-label" for="website">Sitio web</label><input class="form-control" id="website" th:field="*{website}" type="url" maxlength="255"></div>
      <div class="col-md-6"><label class="form-label" for="primaryColor">Color principal</label><input class="form-control form-control-color" id="primaryColor" th:field="*{primaryColor}" type="color" title="Color principal"></div>
      <div class="col-md-6"><label class="form-label" for="secondaryColor">Color secundario</label><input class="form-control form-control-color" id="secondaryColor" th:field="*{secondaryColor}" type="color" title="Color secundario"></div>
    </div>
    <div class="d-flex flex-wrap justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/clubes">Cancelar</a><button class="btn btn-lime" type="submit">Guardar club</button></div>
  </form>
</main>
</body>
</html>
