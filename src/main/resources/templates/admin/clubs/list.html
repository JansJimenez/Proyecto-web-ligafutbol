<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de clubes | Liga Copa Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space">
  <a class="link-green fw-semibold" href="/admin">← Panel</a>
  <div class="section-heading mt-3"><div><span class="eyebrow text-green">MÓDULO INSTITUCIONAL</span><h1>Clubes</h1><p>La desactivación conserva los registros y el historial.</p></div><a class="btn btn-lime" href="/admin/clubes/nuevo">Registrar club</a></div>
  <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
  <div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${!#lists.isEmpty(clubs)}">
    <table class="table align-middle mb-0">
      <thead><tr><th>Club</th><th>Siglas</th><th>Ubicación</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
      <tbody>
      <tr th:each="club : ${clubs}">
        <td class="fw-semibold" th:text="${club.officialName}">Nombre</td>
        <td th:text="${club.acronym != null ? club.acronym : '—'}">—</td>
        <td th:text="${club.district != null ? club.district : (club.province != null ? club.province : '—')}">—</td>
        <td><span class="badge" th:classappend="${club.status.name() == 'ACTIVE' ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${club.status.label}">Activo</span></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/clubes/{id}/editar(id=${club.id})}">Editar</a>
          <form class="d-inline" method="post" th:if="${club.status.name() == 'ACTIVE'}" th:action="@{/admin/clubes/{id}/desactivar(id=${club.id})}" onsubmit="return confirm('¿Desactivar este club? El historial no se eliminará.');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-sm btn-outline-danger" type="submit">Desactivar</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="empty-state" th:if="${#lists.isEmpty(clubs)}"><h2>Aún no hay clubes registrados</h2><p>Registra el primer club para que su información esté disponible desde el panel.</p><a class="btn btn-lime" href="/admin/clubes/nuevo">Registrar club</a></div>
</main>
</body>
</html>
