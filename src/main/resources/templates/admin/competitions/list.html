<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Torneos | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space"><div class="section-heading"><div><span class="eyebrow text-green">COMPETICIONES</span><h1>Torneos</h1><p>Configura categoría, periodo y puntuación de cada competición.</p></div><a class="btn btn-lime" href="/admin/torneos/nuevo">Nuevo torneo</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
<div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${!#lists.isEmpty(competitions)}"><table class="table align-middle mb-0"><thead><tr><th>Torneo</th><th>Temporada</th><th>Categoría</th><th>Puntos (V/E/D)</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="competition : ${competitions}"><td class="fw-semibold" th:text="${competition.name}">Torneo</td><td th:text="${competition.season.name + ' ' + competition.season.year}">Temporada</td><td th:text="${competition.category}">Abierta</td><td th:text="${competition.pointsWin + '/' + competition.pointsDraw + '/' + competition.pointsLoss}">3/1/0</td><td th:text="${competition.status.label}">Planificado</td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/torneos/{id}/editar(id=${competition.id})}">Editar</a><a class="btn btn-sm btn-outline-success" th:href="@{/tabla(torneo=${competition.id})}">Tabla</a></td></tr></tbody></table></div>
<div class="empty-state" th:if="${#lists.isEmpty(competitions)}"><h2>No hay torneos</h2><p>Configura primero una temporada y luego crea un torneo.</p><a class="btn btn-lime mt-3" href="/admin/temporadas/nueva">Crear temporada</a></div></main></body></html>
