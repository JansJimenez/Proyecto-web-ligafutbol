<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' | Liga Copa Perú'">Torneo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space form-container"><a class="link-green fw-semibold" href="/admin/torneos">← Torneos</a><h1 class="mt-4" th:text="${title}">Nuevo torneo</h1>
<div class="alert alert-warning" th:if="${#lists.isEmpty(seasons)}">Necesitas crear una temporada antes de registrar torneos. <a href="/admin/temporadas/nueva">Crear temporada</a></div>
<form class="card form-card mt-4" method="post" th:action="${action}" th:object="${competitionForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="name">Nombre oficial *</label><input class="form-control" id="name" th:field="*{name}" maxlength="150" required><div class="text-danger small" th:errors="*{name}"></div></div>
<div class="col-md-6"><label class="form-label" for="seasonId">Temporada *</label><select class="form-select" id="seasonId" th:field="*{seasonId}" required><option value="">Selecciona temporada</option><option th:each="season : ${seasons}" th:value="${season.id}" th:text="${season.name + ' ' + season.year}"></option></select><div class="text-danger small" th:errors="*{seasonId}"></div></div>
<div class="col-md-4"><label class="form-label" for="category">Categoría *</label><input class="form-control" id="category" th:field="*{category}" maxlength="80" placeholder="Ej.: Primera división" required><div class="text-danger small" th:errors="*{category}"></div></div>
<div class="col-md-4"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" th:field="*{status}"><option th:each="value : ${T(pe.ligacopaperu.torneo.CompetitionStatus).values()}" th:value="${value}" th:text="${value.label}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="pointsWin">Puntos por victoria</label><input class="form-control" id="pointsWin" type="number" min="0" th:field="*{pointsWin}"></div>
<div class="col-md-6"><label class="form-label" for="startDate">Fecha de inicio</label><input class="form-control" id="startDate" type="date" th:field="*{startDate}"></div><div class="col-md-6"><label class="form-label" for="endDate">Fecha de finalización</label><input class="form-control" id="endDate" type="date" th:field="*{endDate}"></div>
<div class="col-md-6"><label class="form-label" for="pointsDraw">Puntos por empate</label><input class="form-control" id="pointsDraw" type="number" min="0" th:field="*{pointsDraw}"></div><div class="col-md-6"><label class="form-label" for="pointsLoss">Puntos por derrota</label><input class="form-control" id="pointsLoss" type="number" min="0" th:field="*{pointsLoss}"></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/torneos">Cancelar</a><button class="btn btn-lime" type="submit" th:disabled="${#lists.isEmpty(seasons)}">Guardar</button></div></form></main></body></html>
