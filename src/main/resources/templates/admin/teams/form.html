<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' | Liga Copa Perú'">Equipo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space form-container"><a class="link-green fw-semibold" href="/admin/equipos">← Equipos</a><h1 class="mt-4" th:text="${title}">Nuevo equipo</h1>
<div class="alert alert-warning" th:if="${#lists.isEmpty(clubs) or #lists.isEmpty(competitions)}">Para inscribir un equipo necesitas al menos un club activo y un torneo.</div>
<form class="card form-card mt-4" method="post" enctype="multipart/form-data" th:action="${action}" th:object="${teamForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="clubId">Club *</label><select class="form-select" id="clubId" th:field="*{clubId}" required><option value="">Selecciona un club</option><option th:each="club : ${clubs}" th:value="${club.id}" th:text="${club.officialName}"></option></select><div class="text-danger small" th:errors="*{clubId}"></div></div>
<div class="col-md-6"><label class="form-label" for="competitionId">Torneo *</label><select class="form-select" id="competitionId" th:field="*{competitionId}" required><option value="">Selecciona un torneo</option><option th:each="competition : ${competitions}" th:value="${competition.id}" th:text="${competition.name + ' · ' + competition.season.year}"></option></select><div class="text-danger small" th:errors="*{competitionId}"></div></div>
<div class="col-md-6"><label class="form-label" for="name">Nombre deportivo *</label><input class="form-control" id="name" th:field="*{name}" maxlength="120" required><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label" for="shortName">Nombre corto</label><input class="form-control" id="shortName" th:field="*{shortName}" maxlength="60"></div>
<div class="col-md-6"><label class="form-label" for="groupName">Grupo</label><input class="form-control" id="groupName" th:field="*{groupName}" maxlength="60" placeholder="Ej.: Grupo A"></div><div class="col-md-6"><label class="form-label" for="stadium">Estadio</label><input class="form-control" id="stadium" th:field="*{stadium}" maxlength="150"></div>
<div class="col-md-6"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value.label}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="crestFile">Escudo o logo del equipo</label><input class="form-control" id="crestFile" type="file" th:field="*{crestFile}" accept="image/png,image/jpeg" data-image-preview="#crestPreview"><div class="form-text">PNG o JPG, máximo 5 MB. Se mostrará en el portal público.</div><img class="upload-preview mt-2" id="crestPreview" th:if="${teamForm.crestUrl != null and !teamForm.removeCrest}" th:src="${teamForm.crestUrl}" alt="Escudo actual del equipo"><label class="form-check mt-2" th:if="${teamForm.crestUrl != null}"><input class="form-check-input" type="checkbox" th:field="*{removeCrest}"><span class="form-check-label">Quitar el escudo actual</span></label></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/equipos">Cancelar</a><button class="btn btn-lime" type="submit" th:disabled="${#lists.isEmpty(clubs) or #lists.isEmpty(competitions)}">Guardar equipo</button></div></form></main></body></html>
