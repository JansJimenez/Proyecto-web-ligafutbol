<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equipos | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space"><div class="section-heading"><div><span class="eyebrow text-green">PLANTILLAS</span><h1>Equipos</h1><p>Inscripción de clubes en torneos y grupos configurables.</p></div><a class="btn btn-lime" href="/admin/equipos/nuevo">Nuevo equipo</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
<div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${!#lists.isEmpty(teams)}"><table class="table align-middle mb-0"><thead><tr><th>Escudo</th><th>Equipo</th><th>Club</th><th>Torneo</th><th>Grupo</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="team : ${teams}"><td><img class="team-crest" th:if="${team.crestUrl != null}" th:src="${team.crestUrl}" th:alt="|Escudo de ${team.name}|"></td><td class="fw-semibold" th:text="${team.name}">Equipo</td><td th:text="${team.club.officialName}">Club</td><td th:text="${team.competition.name}">Torneo</td><td th:text="${team.groupName != null ? team.groupName : '—'}">—</td><td th:text="${team.status.label}">Activo</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/equipos/{id}/editar(id=${team.id})}">Editar</a><form class="d-inline" method="post" th:if="${team.status.name() == 'ACTIVE'}" th:action="@{/admin/equipos/{id}/desactivar(id=${team.id})}" onsubmit="return confirm('¿Desactivar este equipo?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Desactivar</button></form></td></tr></tbody></table></div>
<div class="empty-state" th:if="${#lists.isEmpty(teams)}"><h2>No hay equipos inscritos</h2><p>Registra clubes y torneos antes de crear equipos.</p><a class="btn btn-lime mt-3" href="/admin/equipos/nuevo">Registrar equipo</a></div></main></body></html>
