<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' | Liga Copa Perú'">Temporada</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space form-container"><a class="link-green fw-semibold" href="/admin/temporadas">← Temporadas</a><h1 class="mt-4" th:text="${title}">Nueva temporada</h1>
<form class="card form-card mt-4" method="post" th:action="${action}" th:object="${seasonForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="name">Nombre *</label><input class="form-control" id="name" th:field="*{name}" maxlength="100" required><div class="text-danger small" th:errors="*{name}"></div></div>
<div class="col-md-3"><label class="form-label" for="year">Año *</label><input class="form-control" id="year" type="number" min="1900" max="2200" th:field="*{year}" required><div class="text-danger small" th:errors="*{year}"></div></div>
<div class="col-md-3"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" th:field="*{status}"><option th:each="value : ${T(pe.ligacopaperu.torneo.SeasonStatus).values()}" th:value="${value}" th:text="${value.label}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="startDate">Fecha de inicio</label><input class="form-control" id="startDate" type="date" th:field="*{startDate}"></div>
<div class="col-md-6"><label class="form-label" for="endDate">Fecha de finalización</label><input class="form-control" id="endDate" type="date" th:field="*{endDate}"></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/temporadas">Cancelar</a><button class="btn btn-lime" type="submit">Guardar</button></div></form></main></body></html>
