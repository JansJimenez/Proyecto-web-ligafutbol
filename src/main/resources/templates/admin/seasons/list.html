<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Temporadas | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body>
<header th:replace="~{fragments/navigation :: adminNavigation}"></header>
<main class="container section-space">
  <div class="section-heading"><div><span class="eyebrow text-green">COMPETICIONES</span><h1>Temporadas</h1><p>Conserva el histórico y configura los periodos deportivos.</p></div><a class="btn btn-lime" href="/admin/temporadas/nueva">Nueva temporada</a></div>
  <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
  <div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${!#lists.isEmpty(seasons)}"><table class="table align-middle mb-0"><thead><tr><th>Temporada</th><th>Periodo</th><th>Inicio</th><th>Fin</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="season : ${seasons}"><td class="fw-semibold" th:text="${season.name}">Temporada</td><td th:text="${season.year}">2026</td><td th:text="${season.startDate != null ? season.startDate : '—'}">—</td><td th:text="${season.endDate != null ? season.endDate : '—'}">—</td><td th:text="${season.status.label}">Planificada</td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/temporadas/{id}/editar(id=${season.id})}">Editar</a></td></tr></tbody></table></div>
  <div class="empty-state" th:if="${#lists.isEmpty(seasons)}"><h2>No hay temporadas configuradas</h2><p>Crea una temporada antes de dar de alta torneos.</p></div>
</main>
</body>
</html>
