<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title} + ' | Administración'">Noticia</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header><main class="container section-space form-container"><a class="link-green fw-semibold" href="/admin/noticias">← Noticias</a><h1 class="mt-4" th:text="${title}">Nueva noticia</h1><form class="card form-card mt-4" method="post" enctype="multipart/form-data" th:action="${action}" th:object="${newsForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><div class="row g-3">
<div class="col-md-8"><label class="form-label" for="title">Título *</label><input class="form-control" id="title" th:field="*{title}" maxlength="180" required><div class="text-danger small" th:errors="*{title}"></div></div><div class="col-md-4"><label class="form-label" for="category">Categoría</label><input class="form-control" id="category" th:field="*{category}" maxlength="80"></div>
<div class="col-12"><label class="form-label" for="summary">Resumen *</label><textarea class="form-control" id="summary" rows="2" th:field="*{summary}" maxlength="300" required></textarea><div class="text-danger small" th:errors="*{summary}"></div></div>
<div class="col-12"><label class="form-label" for="content">Contenido *</label><textarea class="form-control" id="content" rows="10" th:field="*{content}" maxlength="20000" required></textarea><div class="text-danger small" th:errors="*{content}"></div><div class="form-text">El contenido se muestra como texto escapado, no se acepta HTML arbitrario.</div></div>
<div class="col-md-6"><label class="form-label" for="imageFile">Imagen de portada</label><input class="form-control" id="imageFile" type="file" th:field="*{imageFile}" accept="image/png,image/jpeg" data-image-preview="#newsImagePreview"><div class="form-text">PNG o JPG, máximo 5 MB. Se mostrará en el portal público.</div><img class="upload-preview mt-2" id="newsImagePreview" th:if="${newsForm.currentImageUrl != null and !newsForm.removeImage}" th:src="${newsForm.currentImageUrl}" alt="Imagen actual de la noticia"><label class="form-check mt-2" th:if="${newsForm.currentImageUrl != null}"><input class="form-check-input" type="checkbox" th:field="*{removeImage}"><span class="form-check-label">Quitar la imagen actual</span></label></div>
<div class="col-md-6"><label class="form-label" for="seoDescription">Descripción para buscadores</label><input class="form-control" id="seoDescription" th:field="*{seoDescription}" maxlength="180"></div>
<div class="col-md-6"><label class="form-label" for="status">Estado de publicación</label><select class="form-select" id="status" th:field="*{status}"><option th:each="value : ${statuses}" th:value="${value}" th:text="${value.label}"></option></select></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/admin/noticias">Cancelar</a><button class="btn btn-lime" type="submit">Guardar noticia</button></div></form></main><script defer src="/js/site.js"></script></body></html>
