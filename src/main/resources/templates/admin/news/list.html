<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Noticias | Administración</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: adminNavigation}"></header><main class="container section-space"><div class="section-heading"><div><span class="eyebrow text-green">COMUNICACIÓN</span><h1>Noticias</h1><p>Los borradores no se muestran en el portal público.</p></div><a class="btn btn-lime" href="/admin/noticias/nueva">Nueva noticia</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${!#lists.isEmpty(articles)}"><table class="table align-middle mb-0"><thead><tr><th>Imagen</th><th>Título</th><th>Categoría</th><th>Autor</th><th>Estado</th><th>Publicación</th><th></th></tr></thead><tbody><tr th:each="article : ${articles}"><td><img class="team-crest" th:if="${article.imageUrl != null}" th:src="${article.imageUrl}" th:alt="|Imagen de ${article.title}|"></td><td class="fw-semibold" th:text="${article.title}">Título</td><td th:text="${article.category != null ? article.category : '—'}">—</td><td th:text="${article.author.username}">Autor</td><td th:text="${article.status.label}">Borrador</td><td th:text="${article.publishedAt != null ? #temporals.format(article.publishedAt, 'dd/MM/yyyy') : '—'}">—</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/noticias/{id}/editar(id=${article.id})}">Editar</a><a class="btn btn-sm btn-outline-success" th:if="${article.status.name() == 'PUBLISHED'}" th:href="@{/noticias/{slug}(slug=${article.slug})}">Ver</a><form class="d-inline" method="post" th:if="${article.status.name() != 'ARCHIVED'}" th:action="@{/admin/noticias/{id}/archivar(id=${article.id})}" onsubmit="return confirm('¿Archivar esta noticia?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Archivar</button></form></td></tr></tbody></table></div><div class="empty-state" th:if="${#lists.isEmpty(articles)}"><h2>Aún no hay noticias</h2><p>Publica comunicados cuando la información esté confirmada.</p></div></main></body></html>
