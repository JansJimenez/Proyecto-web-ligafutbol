<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Equipos activos y clubes de la Liga Copa Perú."><title>Equipos | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: publicNavigation}"></header>
<main class="container section-space"><span class="eyebrow text-green">COMPETICIÓN</span><h1>Equipos</h1><p class="text-secondary">Equipos activos inscritos en los torneos.</p><div class="row g-3 mt-2" th:if="${!#lists.isEmpty(teams)}"><div class="col-md-6 col-lg-4" th:each="team : ${teams}"><article class="club-card h-100"><img class="team-crest mb-3" th:if="${team.crestUrl != null}" th:src="${team.crestUrl}" th:alt="|Escudo de ${team.name}|"><div class="club-mark" aria-hidden="true" th:unless="${team.crestUrl != null}" th:text="${team.club.acronym != null ? team.club.acronym : 'FC'}">FC</div><h2 th:text="${team.name}">Equipo</h2><p class="text-secondary" th:text="${team.club.officialName}">Club</p><p><strong th:text="${team.competition.name}">Torneo</strong><span th:text="${' · ' + team.competition.season.year}">· Temporada</span></p><p th:if="${team.groupName != null}" th:text="${'Grupo ' + team.groupName}">Grupo</p></article></div></div><div class="empty-state mt-4" th:if="${#lists.isEmpty(teams)}"><h2>No hay equipos publicados</h2><p>La información aparecerá cuando la liga registre equipos activos.</p></div></main><footer class="site-footer"><div class="container">Liga Copa Perú · Equipos</div></footer></body></html>
