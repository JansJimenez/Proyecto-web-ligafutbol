<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Equipos activos y clubes de la Liga Copa Perú."><title>Equipos | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: publicNavigation}"></header>
<main class="container section-space">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div>
      <span class="eyebrow text-green">COMPETICIÓN · ETAPAS COPA PERÚ</span>
      <h1>Equipos</h1>
      <p class="text-secondary mb-0">Equipos activos inscritos en las distintas etapas y series del torneo.</p>
    </div>
    <form class="d-flex flex-wrap gap-2 align-items-center" method="get" action="/equipos" th:if="${competitions != null and !#lists.isEmpty(competitions)}">
      <select class="form-select" name="torneo" aria-label="Filtrar por torneo">
        <option value="">Todas las etapas y torneos</option>
        <option th:each="comp : ${competitions}" th:value="${comp.id}" th:text="${comp.name + ' · ' + comp.season.year}" th:selected="${selectedTorneo != null and selectedTorneo == comp.id}"></option>
      </select>
      <button class="btn btn-lime" type="submit">Filtrar</button>
    </form>
  </div>
  <div class="row g-3 mt-2" th:if="${!#lists.isEmpty(teams)}">
    <div class="col-md-6 col-lg-4" th:each="team : ${teams}">
      <article class="club-card h-100">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <img class="team-crest" th:if="${team.crestUrl != null}" th:src="${team.crestUrl}" th:alt="|Escudo de ${team.name}|">
          <div class="club-mark mb-0" aria-hidden="true" th:unless="${team.crestUrl != null}" th:text="${team.club.acronym != null ? team.club.acronym : 'FC'}">FC</div>
          <span class="stage-pill" th:if="${team.groupName != null}" th:text="${team.groupName}">Serie A</span>
        </div>
        <h2 th:text="${team.name}">Equipo</h2>
        <p class="text-secondary mb-2" th:text="${team.club.officialName}">Club</p>
        <p class="mb-1"><strong th:text="${team.competition.name}">Torneo</strong><span th:text="${' · ' + team.competition.season.year}">· Temporada</span></p>
        <p class="small text-muted mb-1" th:if="${team.competition.category != null}" th:text="${team.competition.category}">Etapa</p>
        <p class="small text-muted mb-0" th:if="${team.stadium != null}" th:text="${'Localía: ' + team.stadium}">Estadio</p>
      </article>
    </div>
  </div>
  <div class="empty-state mt-4" th:if="${#lists.isEmpty(teams)}"><h2>No hay equipos publicados</h2><p>La información aparecerá cuando la liga registre equipos activos.</p></div>
</main><footer class="site-footer"><div class="container">Liga Copa Perú · Equipos</div></footer></body></html>
