<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Noticias y comunicados publicados por la Liga Copa Perú."><title>Noticias | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: publicNavigation}"></header>
<main class="container section-space"><span class="eyebrow text-green">COMUNICACIÓN OFICIAL</span><h1>Noticias</h1><p class="text-secondary">Publicaciones institucionales de la liga.</p><div class="row g-3 mt-2" th:if="${!#lists.isEmpty(articles)}"><div class="col-md-6 col-lg-4" th:each="article : ${articles}"><article class="club-card h-100"><img class="news-cover" th:if="${article.imageUrl != null}" th:src="${article.imageUrl}" th:alt="|Imagen de ${article.title}|"><p class="eyebrow text-green" th:if="${article.category != null}" th:text="${article.category}">Categoría</p><h2 th:text="${article.title}">Título</h2><p class="text-secondary" th:text="${article.summary}">Resumen</p><a class="link-green fw-semibold" th:href="@{/noticias/{slug}(slug=${article.slug})}">Leer noticia →</a></article></div></div><div class="empty-state mt-4" th:if="${#lists.isEmpty(articles)}"><h2>No hay noticias publicadas</h2><p>Los comunicados aparecerán aquí cuando la organización los publique.</p></div></main><footer class="site-footer"><div class="container">Liga Copa Perú · Noticias</div></footer></body></html>
