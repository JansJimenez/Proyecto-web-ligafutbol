<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Calendario y resultados publicados por la Liga Copa Perú."><title>Partidos | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: publicNavigation}"></header>
<main class="container section-space"><span class="eyebrow text-green">COMPETICIÓN</span><h1>Partidos</h1><p class="text-secondary">Calendario y marcadores finalizados.</p><div class="table-responsive bg-white rounded-4 shadow-sm mt-4" th:if="${!#lists.isEmpty(matches)}"><table class="table align-middle mb-0"><thead><tr><th>Fecha</th><th>Torneo</th><th>Encuentro</th><th>Resultado</th><th>Estado</th></tr></thead><tbody><tr th:each="match : ${matches}"><td th:text="${#temporals.format(match.scheduledAt, 'dd/MM/yyyy HH:mm')}">Fecha</td><td th:text="${match.competition.name}">Torneo</td><td><span th:text="${match.homeTeam.name}">Local</span><span> vs </span><span th:text="${match.awayTeam.name}">Visitante</span></td><td class="fw-bold" th:text="${match.status.name() == 'FINALIZED' ? match.homeGoals + ' - ' + match.awayGoals : '—'}">—</td><td th:text="${match.status.label}">Estado</td></tr></tbody></table></div><div class="empty-state mt-4" th:if="${#lists.isEmpty(matches)}"><h2>No hay partidos publicados</h2><p>El calendario se mostrará cuando la organización programe encuentros.</p></div></main><footer class="site-footer"><div class="container">Liga Copa Perú · Calendario</div></footer></body></html>
