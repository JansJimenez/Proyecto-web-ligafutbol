<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" th:content="${article.seoDescription != null ? article.seoDescription : article.summary}"><meta property="og:title" th:content="${article.title}"><meta property="og:description" th:content="${article.summary}"><title th:text="${article.title + ' | Liga Copa Perú'}">Noticia | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: publicNavigation}"></header><main class="container section-space form-container"><a class="link-green fw-semibold" href="/noticias">← Noticias</a><article class="mt-4"><span class="eyebrow text-green" th:if="${article.category != null}" th:text="${article.category}">Categoría</span><h1 class="mt-2" th:text="${article.title}">Título</h1><p class="lead text-secondary" th:text="${article.summary}">Resumen</p><p class="small text-secondary" th:if="${article.publishedAt != null}" th:text="${#temporals.format(article.publishedAt, 'dd/MM/yyyy HH:mm')}">Fecha</p><img class="img-fluid rounded-4 mb-4" th:if="${article.imageUrl != null}" th:src="${article.imageUrl}" th:alt="|Imagen de ${article.title}|"><div class="article-content" th:text="${article.content}">Contenido</div></article></main><footer class="site-footer"><div class="container">Liga Copa Perú · Noticia oficial</div></footer></body></html>
