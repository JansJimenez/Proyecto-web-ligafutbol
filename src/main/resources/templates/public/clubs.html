<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Directorio de clubes activos de la Liga Copa Perú.">
  <title>Clubes | Liga Copa Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/navigation :: publicNavigation}"></header>
<main class="container section-space">
  <span class="eyebrow text-green">DIRECTORIO</span>
  <h1>Clubes activos</h1>
  <p class="text-secondary mb-4">Información institucional disponible para consulta pública.</p>
  <div class="row g-3" th:if="${!#lists.isEmpty(clubs)}">
    <div class="col-md-6 col-lg-4" th:each="club : ${clubs}">
      <article class="club-card h-100">
        <div class="club-mark" aria-hidden="true" th:text="${club.acronym != null ? club.acronym : 'FC'}">FC</div>
        <h2 th:text="${club.officialName}">Nombre del club</h2>
        <p class="text-secondary" th:text="${club.description != null ? club.description : 'Perfil institucional del club.'}">Descripción</p>
        <dl class="small mb-0">
          <div th:if="${club.department != null}"><dt class="d-inline">Departamento: </dt><dd class="d-inline" th:text="${club.department}">—</dd></div>
          <div th:if="${club.stadium != null}"><dt class="d-inline">Estadio: </dt><dd class="d-inline" th:text="${club.stadium}">—</dd></div>
        </dl>
      </article>
    </div>
  </div>
  <div class="empty-state" th:if="${#lists.isEmpty(clubs)}"><h2>No hay clubes publicados</h2><p>El directorio se actualizará cuando la liga publique sus registros.</p></div>
</main>
<footer class="site-footer"><div class="container">Liga Copa Perú · Directorio público</div></footer>
</body>
</html>
