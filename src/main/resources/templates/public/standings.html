<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Tabla de posiciones basada en partidos finalizados y validados."><title>Tabla de posiciones | Liga Copa Perú</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/site.css" rel="stylesheet"></head>
<body><header th:replace="~{fragments/navigation :: publicNavigation}"></header>
<main class="container section-space"><span class="eyebrow text-green">COMPETICIÓN</span><h1>Tabla de posiciones</h1><form class="row g-2 align-items-end mt-2 mb-4" method="get" action="/tabla"><div class="col-md-6"><label class="form-label" for="torneo">Torneo</label><select class="form-select" id="torneo" name="torneo"><option th:each="competition : ${competitions}" th:value="${competition.id}" th:text="${competition.name + ' · ' + competition.season.year}" th:selected="${selectedCompetition != null and selectedCompetition.id == competition.id}"></option></select></div><div class="col-auto"><button class="btn btn-lime">Consultar</button></div></form>
<div class="alert alert-light" th:if="${selectedCompetition != null}" th:text="${selectedCompetition.name + ' · ' + selectedCompetition.season.name + ' ' + selectedCompetition.season.year + ' · Puntuación: victoria ' + selectedCompetition.pointsWin + ', empate ' + selectedCompetition.pointsDraw + ', derrota ' + selectedCompetition.pointsLoss}">Torneo</div>
<div class="table-responsive bg-white rounded-4 shadow-sm" th:if="${table != null and !#lists.isEmpty(table)}"><table class="table align-middle mb-0"><thead><tr><th>#</th><th>Equipo</th><th>Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody><tr th:each="row, iter : ${table}"><td th:text="${iter.count}">1</td><td class="fw-semibold" th:text="${row.teamName}">Equipo</td><td th:text="${row.clubName}">Club</td><td th:text="${row.played}">0</td><td th:text="${row.won}">0</td><td th:text="${row.drawn}">0</td><td th:text="${row.lost}">0</td><td th:text="${row.goalsFor}">0</td><td th:text="${row.goalsAgainst}">0</td><td th:text="${row.goalDifference}">0</td><td class="fw-bold" th:text="${row.points}">0</td></tr></tbody></table></div>
<div class="empty-state" th:if="${selectedCompetition == null or #lists.isEmpty(table)}"><h2>Sin posiciones calculadas</h2><p>La tabla se genera a partir de equipos activos y partidos finalizados.</p></div></main><footer class="site-footer"><div class="container">Liga Copa Perú · Tabla</div></footer></body></html>
