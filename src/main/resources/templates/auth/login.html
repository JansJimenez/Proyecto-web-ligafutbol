<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso administrativo | Liga Copa Perú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body class="login-page">
<main class="login-card">
  <div class="login-brand"><img src="/images/copa-peru-logo.png" alt="Emblema Copa Perú"><img src="/images/fpf-logo.png" alt="Federación Peruana de Fútbol"></div>
  <a class="text-decoration-none link-green fw-bold" href="/">← Volver al portal</a>
  <span class="eyebrow text-green d-block mt-4">ÁREA SEGURA</span>
  <h1 class="h2 mt-2">Acceso administrativo</h1>
  <p class="text-secondary">Ingresa con la cuenta autorizada de la organización.</p>
  <div class="alert alert-danger" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
  <div class="alert alert-success" role="status" th:if="${param.logout}">La sesión se cerró correctamente.</div>
  <form method="post" th:action="@{/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3"><label class="form-label" for="username">Usuario</label><input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus></div>
    <div class="mb-4"><label class="form-label" for="password">Contraseña</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-lime btn-lg w-100" type="submit">Iniciar sesión</button>
  </form>
</main>
<div class="navigation-loader" aria-hidden="true"><img src="/images/copa-peru-logo.png" alt=""><span class="loader-ball"></span><strong>Validando acceso</strong></div>
<script defer src="/js/site.js"></script>
</body>
</html>
