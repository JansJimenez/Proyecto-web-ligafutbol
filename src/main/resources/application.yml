spring:
  application:
    name: liga-copa-peru
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/liga-copa-peru;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  league-name: ${LEAGUE_NAME:Liga Provincial de San Marcos · Copa Perú}
  uploads:
    location: ${UPLOADS_LOCATION:${user.home}/.liga-copa-peru/uploads}
  firebase:
    service-account: ${FIREBASE_SERVICE_ACCOUNT:firebase-service-account.json}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:AdminCopaPeru2026!}
