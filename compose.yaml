services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liga_copa_peru
      POSTGRES_USER: ${DB_USERNAME:-liga_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - liga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-liga_app} -d liga_copa_peru"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liga-postgres-data:
